<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a game</title>

    <link type="text/css" href="styles/reset.css" rel="stylesheet" />
    <link type="text/css" href="styles/style.css" rel="stylesheet" />

    <script src="js/dom-helpers.js" defer></script>
    <script src="js/add-games.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header>
        <img
          src="images/logegames.jpg"
          alt="Logo image of games"
          class="logo"
        />

        <nav>
          <ul>
            <li class="actual">
              <a href="index.html">Home</a>
            </li>

            <li>
              <a href="table-overview.html">Statistics</a>
            </li>
            <li>
              <a href="add-game.html">Add game</a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <h2>Add a game</h2>

        <form id="add-game-form">
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" />
          </div>
          <div class="form-group">
            <label for="type">Type:</label>
            <input type="text" id="type" name="type" />
          </div>
          <div class="form-group">
            <label for="rating">Rating:</label>
            <input
              type="number"
              id="rating"
              name="rating"
              min="0.0"
              max="10.0"
              step="0.1"
            />
          </div>
          <button type="submit">Add this game</button>
        </form>

        <div id="status"></div>
      </main>

      <footer>Jessica Vervaet - Front-end - 2026</footer>
    </div>
  </body>
</html>
