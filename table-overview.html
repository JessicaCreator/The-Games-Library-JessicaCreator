<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table-overview</title>

    <link type="text/css" href="styles/reset.css" rel="stylesheet" />
    <link type="text/css" href="styles/style.css" rel="stylesheet" />

    <script src="js/dom-helpers.js" defer></script>
    <!-- <script src="js/dom.js" defer></script> -->
    <script src="js/table-overview.js" defer></script>
  </head>

  <body>
    <div class="container">
      <header>
        <img
          src="images/logegames.jpg"
          alt="Logo image of games"
          class="logo"
        />
        <nav>
          <ul>
            <li>
              <a href="index.html">Home</a>
            </li>
            <li class="actual">
              <a href="statistics.html">Statistics</a>
            </li>
            <li>
              <a href="add-game.html">Add game</a>
            </li>
          </ul>
        </nav>
      </header>
      <main>
        <h2>My Games</h2>
        <div class="button-container">
          <button id="show-favourite">Show my favourite games</button>
          <button id="show-all">Show all games</button>
        </div>

        <label for="show-rating">Show games with a rating higher than:</label>
        <input id="show-rating" />

        <div class="button-container">
          <button id="get-games">Get games</button>
          <label for="search-games">from backend with name containing:</label>
          <input id="search-games" />
        </div>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Rating</th>
            </tr>
          </thead>
        </table>
      </main>
      <!-- Replace Student_name_here by your name -->
      <footer>Jessica Vervaet - Front-end - 2026</footer>
    </div>
  </body>
